[project]
name = "ypres"
version = "1.1.3"
description = "ypres is a simple object serialization framework built for speed."
authors = [{ name = "Andrew Hankinson", email = "andrew.hankinson@gmail.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []
keywords = ["serialization", "serializer", "json", "asyncio", "typing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rism-digital/ypres"
Source = "https://github.com/rism-digital/ypres"
Issues = "https://github.com/rism-digital/ypres/issues"

[dependency-groups]
dev = [
    "build>=1.2.2,<2",
    "py>=1.4.26",
    "mypy>=1.2.0,<2",
    "ipython>=9.0.0,<10",
    "pyright>=1.1.405",
    "twine>=6.1.0,<7",
    "wheel>=0.40.0,<0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ypres"]

[tool.hatch.build.targets.wheel.force-include]
"ypres/py.typed" = "ypres/py.typed"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pycodestyle warnings
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    ## Flake8 plugins
    "UP",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C",
    # flake8-django
    "DJ",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    # Ignore Pycodestyle line-length warnings, (mainly long comments).
    "E501",
    # Ignore McCabe complexity (for now).
    "C901",
]
